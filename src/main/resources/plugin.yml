name: Backrooms
version: ${project.version}
main: de.backrooms.BackroomsPlugin
description: Backrooms-Abenteuer mit Leveln, Gegnern, Warden-Boss und Sonder-TNT (Eaglercraft-kompatibel)
author: Backrooms

commands:
  start:
    description: Ausruestung bekommen und in die Backrooms fallen
    usage: /<command>
    permission: backrooms.start
    permission-message: Dazu fehlt dir die Berechtigung.
  backrooms:
    description: Verwaltung der Backrooms (Level, Items, Gegner)
    usage: /<command> level|verlassen|item|gegner|info|reload
    permission: backrooms.admin
    permission-message: Dazu fehlt dir die Berechtigung.

permissions:
  backrooms.start:
    description: Erlaubt /start
    default: true
  backrooms.admin:
    description: Erlaubt /backrooms (Level wechseln, Items geben, Gegner spawnen)
    default: op
  backrooms.bauen:
    description: Erlaubt Bauen/Abbauen in der Backrooms-Welt (nur im Kreativmodus)
    default: op
