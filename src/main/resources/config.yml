# ==========================================================
#  Backrooms - Konfiguration (Spigot/Paper 1.8.8)
#  Hinweis: Bitte in dieser Datei keine Umlaute verwenden.
#  Nach Aenderungen: /backrooms reload
# ==========================================================

welt:
  # Name der Backrooms-Welt (wird beim ersten Start erzeugt)
  name: backrooms
  # Duerfen sich Spieler in den Backrooms gegenseitig verletzen?
  pvp: false

# Was /start gibt
start:
  # Verzauberung des Diamantschwerts (Schaerfe)
  schwert-schaerfe: 3
  # Verzauberung der Diamantruestung (Schutz)
  ruestung-schutz: 2
  # Haltbarkeit fuer Schwert und Ruestung
  haltbarkeit: 3
  mandelwasser: 3
  energieriegel: 8
  # Anzahl je Sonder-TNT-Typ (Mega, Feuer, Blitz, Lift, Cluster), 0 = keine
  sonder-tnt-je-typ: 8

licht:
  # Deckenlichter in Level 0 und 1 flackern
  flackern: true
  # Wahrscheinlichkeit pro Spieler alle halbe Sekunde
  flacker-chance: 0.25

gegner:
  aktiviert: true
  spawn-intervall-sekunden: 5
  # Maximal so viele Gegner im Umkreis von 40 Bloecken um einen Spieler
  max-pro-spieler: 5
  max-gesamt: 60
  abstand-min: 12
  abstand-max: 26
  # Lebenspunkte (2 = 1 Herz)
  leben:
    hound: 24
    smiler: 40
    skin_stealer: 30
    partygoer: 24
    faceling: 20
    todesmotte: 12
  # Welche Gegner in welchem Level erscheinen (Zahl = Haeufigkeit, 0 = nie)
  spawn:
    level0:
      hound: 4
      skin_stealer: 2
      faceling: 3
      smiler: 1
    level1:
      partygoer: 4
      todesmotte: 3
      hound: 2
      skin_stealer: 1
    level2:
      smiler: 4
      skin_stealer: 2
      todesmotte: 2
      hound: 1
  # Chance in Prozent, dass ein besiegter Gegner das Item fallen laesst
  beute:
    mandelwasser: 10
    energieriegel: 15

boss:
  # Lebenspunkte des Warden
  leben: 300
  # Schaden des Schallschlags (ignoriert Ruestung)
  schallschlag-schaden: 6.0
  schallschlag-sekunden: 5
  # Alle x Sekunden Blindheit fuer alle in der Arena
  dunkelheit-sekunden: 8

# Vorratstruhen in neu erzeugten Backrooms-Chunks
vorrat:
  chance:
    level0: 0.06
    level1: 0.30
    level2: 0.10
  # Format: MATERIAL:min:max:chance (Chance in Prozent)
  # Backrooms-Items: BACKROOMS_<ITEM>, Sonder-TNT: SONDERTNT_<TYP>
  loot:
    - "BACKROOMS_MANDELWASSER:1:1:60"
    - "BACKROOMS_ENERGIERIEGEL:1:4:60"
    - "BREAD:1:4:40"
    - "ARROW:4:12:25"
    - "IRON_INGOT:1:3:25"
    - "GOLDEN_APPLE:1:1:10"
    - "SONDERTNT_MEGA:1:1:5"
    - "SONDERTNT_LIFT:1:2:10"
    - "SONDERTNT_CLUSTER:1:1:8"

# Sonder-TNT (kommen ueber /start oder Vorratstruhen)
tnt:
  # Zuendzeit in Ticks (20 Ticks = 1 Sekunde). Vanilla-TNT: 80
  zuendzeit: 80
  mega:
    staerke: 15.0
  feuer:
    staerke: 4.0
    radius: 5
    dichte: 0.35
    brenndauer-ticks: 160
  blitz:
    staerke: 4.0
    anzahl: 5
    radius: 6.0
    verzoegerung-ticks: 4
    nur-effekt: false
  lift:
    radius: 7.0
    hoehe: 2.0
    seitlich: 0.4
    fallschaden-verhindern: true
    fallschutz-sekunden: 15
  cluster:
    staerke: 4.0
    anzahl: 6
    klein-staerke: 2.0
    zuendzeit-min: 20
    zuendzeit-max: 50
    streuung: 0.35
